services:
  db:
    image: mysql:lts
    container_name: ceidtrip-db
    restart: always
    command: --secure-file-priv=""
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
      - ./database/database_schema:/scripts/1_creation:ro
      - ./database/stored_procedures_scripts:/scripts/2_procedures:ro
      - ./database/triggers_scripts:/scripts/3_triggers:ro
      - ./database/database_seeding_scripts:/scripts/4_insertions:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 40s
      
volumes:
  mysql_data:
