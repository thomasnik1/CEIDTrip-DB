services:
  db:
    image: mysql:8.0.44-debian
    container_name: ceidtrip-db
    environment:
      MYSQL_DATABASE: travel_agency
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./create_travel_agency_db.sql:/docker-entrypoint-initdb.d/01_create_db.sql
      - ./insert_travel_agency_db.sql:/docker-entrypoint-initdb.d/02_insert_db.sql

